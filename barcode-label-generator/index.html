<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Label Generator - A4 Print</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="input-section">
        <h1>Barcode Label Generator</h1>
        <p class="subtitle">Upload barcode image + Enter name = Printable A4 sheet</p>

        <div class="form-group">
            <label for="barcode-upload">Upload Barcode Image:</label>
            <input type="file" id="barcode-upload" accept="image/*">
            <div class="preview" id="preview-area">
                <p>No image selected</p>
            </div>
        </div>

        <div class="form-group">
            <label for="label-name">Name (appears under barcode):</label>
            <input type="text" id="label-name" placeholder="Enter product/item name">
        </div>

        <div class="form-group">
            <label for="copies">Number of labels per page:</label>
            <select id="copies">
                <option value="10">10 (2 columns x 5 rows)</option>
                <option value="12">12 (3 columns x 4 rows)</option>
                <option value="15">15 (3 columns x 5 rows)</option>
                <option value="20" selected>20 (4 columns x 5 rows)</option>
                <option value="24">24 (4 columns x 6 rows)</option>
                <option value="30">30 (5 columns x 6 rows)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="pages">Number of pages:</label>
            <input type="number" id="pages" value="1" min="1" max="20">
        </div>

        <button id="generate-btn" class="btn-generate">Generate A4 Sheet</button>
    </div>

    <!-- Print Area -->
    <div id="print-area"></div>

    <!-- Print Controls (shown after generation) -->
    <div class="print-controls" id="print-controls" style="display:none;">
        <button id="print-btn" class="btn-print" onclick="window.print()">Print A4 Sheet</button>
        <button id="back-btn" class="btn-back" onclick="goBack()">Back to Edit</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
